<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Not Found | AUROSTRON</title>
  <meta name="description" content="404 — This page doesn't exist.">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23080808'/><text x='50' y='68' font-family='sans-serif' font-weight='900' font-size='56' fill='%23ffffff' text-anchor='middle'>A</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --ink:       #f0f0f0;
      --ink-2:     #888888;
      --ink-3:     #2a2a2a;
      --border:    rgba(255, 255, 255, 0.1);
      --font:      'Space Grotesk', system-ui, sans-serif;
      --serif:     'Instrument Serif', Georgia, serif;
      --mono:      'JetBrains Mono', monospace;
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      position: relative;
    }

    /* Animated background lines */
    #noise-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Main content */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-width: 540px;
      width: 100%;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .label {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      color: var(--ink-2);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    /* Giant 404 */
    .code {
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.85;
      color: var(--ink);
      display: block;
      margin-bottom: 2rem;
    }

    /* Serif subheading */
    .heading {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 400;
      color: var(--ink-2);
      line-height: 1.3;
      margin-bottom: 1.25rem;
    }

    .desc {
      font-size: 0.95rem;
      color: var(--ink-2);
      line-height: 1.65;
      max-width: 380px;
      margin-bottom: 3rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--ink-3);
      margin: 0 auto 3rem;
    }

    /* Return link */
    .return-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 0.75rem 1.75rem;
      border-radius: 999px;
      transition: background 0.2s var(--ease), border-color 0.2s, transform 0.2s var(--ease);
    }

    .return-link:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .return-link:active { transform: scale(0.97); }

    .arrow { font-size: 1rem; }
  </style>
</head>
<body>

  <canvas id="noise-canvas" aria-hidden="true"></canvas>

  <main class="content">
    <p class="label">AUROSTRON.GITHUB.IO</p>

    <span class="code" aria-label="Error 404">404</span>

    <h1 class="heading">Nothing here.</h1>

    <div class="divider"></div>

    <p class="desc">
      The page you're looking for doesn't exist, was moved, or never did.
    </p>

    <a href="./" class="return-link">
      <span class="arrow">←</span> Back to Home
    </a>
  </main>

  <script>
    const canvas = document.getElementById('noise-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, t = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function noise(x, y, seed) {
      const n = Math.sin(x * 127.1 + y * 311.7 + seed) * 43758.5453;
      return n - Math.floor(n);
    }

    function smooth(x, y, seed) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      return noise(ix,iy,seed) + (noise(ix+1,iy,seed)-noise(ix,iy,seed))*ux +
             (noise(ix,iy+1,seed)-noise(ix,iy,seed))*uy +
             (noise(ix+1,iy+1,seed)-noise(ix,iy+1,seed)-noise(ix+1,iy,seed)+noise(ix,iy,seed))*ux*uy;
    }

    function render() {
      t += 0.005;
      ctx.clearRect(0, 0, W, H);

      const lines = 10;
      for (let i = 0; i < lines; i++) {
        const baseY = (i / (lines - 1)) * H;
        const alpha = 0.022 + (i % 3 === 0 ? 0.035 : 0);
        ctx.beginPath();
        ctx.moveTo(0, baseY);
        for (let x = 0; x <= W; x += 22) {
          const n = smooth(x * 0.0022 + t * 0.12 + i * 0.45, i * 0.28, 77);
          ctx.lineTo(x, baseY + (n - 0.5) * 55);
        }
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = i % 3 === 0 ? 1.1 : 0.6;
        ctx.stroke();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
