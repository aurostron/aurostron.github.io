# Building hoGAMEGATA: Preserving 100,000+ Horror Games

*Published on October 24, 2026 • 6 min read • by aurostron*

---

Most video game preservation efforts focus on the top 1% of mainstream titles. Blockbusters get remastered, re-released, and documented in encyclopedic detail. But what happens to the weird indie horror experiments, the 3 AM itch.io game jam prototypes, the forgotten RPG Maker titles, and the cult classics that defined niche sub-genres?

They disappear.

That frustration was the initial spark behind **hoGAMEGATA**.

## The Shower Thought That Spun Out of Control

Like most of my favorite projects, hoGAMEGATA started either as a shower thought or sheer frustration with not finding the tools I wanted. I was looking for obscure horror titles from early indie eras and realized the data was scattered across fragmented forums, dead wikis, and discontinued databases.

I didn't want another bloated website filled with ad trackers, mandatory account signups, popups, and slow pagination. I wanted something clean:
- **Instant client-side search** across the entire catalog.
- **Zero ads, zero trackers, zero paywalls**.
- **No account required** to browse, discover, or export information.
- **A fast, keyboard-first interface** that respects the user's time.

## Scaling to 107,000 Titles & 68,000 Developers

What started as a personal collection rapidly scaled into indexing over **107,000 titles** and **68,000 developers**. 

Handling that scale without incurring massive hosting costs or sluggish page loads required careful architectural decisions:

1. **Astro for Static Performance**: Astro gave us zero-JS baselines for content pages, shipping only the JavaScript needed for interactive exploration.
2. **Cloudflare Workers for Global Edge Latency**: By running serverless edge functions close to users worldwide, search responses stay under 50ms regardless of location.
3. **Turso (LibSQL) & Drizzle ORM**: Lightweight edge SQLite instances replicate data globally, allowing sub-millisecond query execution without heavy database server overhead.
4. **Optimized Client-Side Inverted Index**: Frequently searched subsets are indexed directly in memory so typing instantly narrows down results as fast as your fingers can move.

```typescript
// Architectural Core: Client-side search pipeline
export interface GameRecord {
  id: string;
  title: string;
  year: number;
  developer: string;
  platform: string[];
  subgenre: 'psychological' | 'survival' | 'analog' | 'found-footage' | 'retro';
  tags: string[];
}
```

## Why Horror Needs Preservation

Horror has always been the sandbox where developers push atmospheric boundaries. Because horror often relies on subverting expectations and experimenting with low-fidelity aesthetics (PS1 retro-style, VHS tracking artifacts, analog audio distortion), many of these games were distributed as freeware or standalone zip files.

When free hosting domains expire or download links break, entire creative lineages vanish. hoGAMEGATA treats these projects as culturally significant software artifacts worthy of the same archival care as 35mm film or printed literature.

> "A database shouldn't just be an inventory; it should be a cultural time capsule that anyone can explore without friction."

## What's Next?

We're currently working on:
- Automated metadata validation against archived snapshots.
- Direct developer attribution portals for indie creators to claim and enrich their pages.
- Deeper integration with open emulation runtimes so rare titles can be experienced right in the browser.

Stay tuned for more updates. If you have titles that should be preserved, you can explore the engine at [gamegata.xyz](https://gamegata.xyz).

# OpenLyryc: Crafting a Browser-Native Synced Lyrics Workstation


---

Most lyrics tools on the internet are either locked behind clunky desktop software from 2008, trapped inside proprietary streaming platforms, or cluttered with intrusive ads. If you want word-by-word synchronized lyrics (karaoke style) or clean timecoded subtitles, the workflow is often tedious: download an installer, manually calculate millisecond timestamps, or fight with video editors.

I wanted something different: an instant, browser-native synced lyrics workstation that opens anywhere, works offline, and exports clean, standardized formats.

That was the foundation for **OpenLyryc**.

## The Core Problems with Traditional Lyric Editors

When diving into timecoded audio synchronization, three major friction points stand out:

1. **Precision Timing Drift**: Traditional `<audio>` element playback in browsers often drifts during seeking and rapid scrubbing. Achieving sub-frame timestamp precision required leveraging the browser's native **Web Audio API** (`AudioContext.currentTime`) rather than relying on standard HTML audio events.
2. **Standardization Chaos**: The world of timed lyrics is split between simple line-level formats (standard `.lrc`), word-level formats (Enhanced LRC `[mm:ss.xx]<mm:ss.xx>word`), and modern rich formats (Apple Music `.ttml` / Timed Text Markup Language). Converting between them without losing metadata was unnecessarily painful.
3. **Stage Visualizer Demands**: Musicians, live performers, and streamers often need a clean, teleprompter-style visualizer with zero distraction, adjustable font sizes, and smooth scrolling anticipation before the next line begins.

## Architecture & How It Works

OpenLyryc runs 100% on the client. Your audio files, recordings, and custom lyrics never get uploaded to an external server.

```typescript
// Sample lyric token with millisecond word boundary timestamps
export interface LyricWordToken {
  word: string;
  startMs: number;
  endMs: number;
  pitchEstimate?: number;
}

export interface LyricLine {
  lineIndex: number;
  startTimeMs: number;
  endTimeMs: number;
  rawText: string;
  words: LyricWordToken[];
}
```

### Key Technical Pillars:

- **Web Audio Engine**: Handles sample-accurate playback, audio scrubbing, variable playback rates (for slow-motion timing calibration), and visual waveform rendering via Canvas.
- **LRCLIB Integration**: Seamlessly searches public databases to pull existing community lyrics as an initial scaffolding, saving hundreds of keystrokes.
- **Word-Level Tap Synchronization**: Spacebar and hotkey tapping lets you synchronize words at real-time playback speed or with keyboard nudges (`Alt + Left/Right` for 10ms offsets).
- **Dual Export Pipeline**:
  - **Enhanced LRC**: Compatible with modern open-source media players (VLC, mpv, Foobar2000).
  - **Apple Music TTML**: Rich XML timed text format complete with syllable timing, agents, and span metadata.

## The Visual Stage Prompter

Beyond editing, OpenLyryc features a dedicated full-screen stage mode. It strips away all controls, dims the UI, and elevates active lines with smooth CSS transforms and readable typography designed for performance booths and practice rooms.

> "Software designed for audio shouldn't feel like filling out a spreadsheet. It should feel like playing an instrument."

## Future Directions

Some features in active development and experimentation:
- AI-assisted initial alignment using client-side WebAssembly speech-to-text models.
- Dual-track translations and romanization (romaji, pinyin, hangul) for international songs.
- MIDI controller pedal support for hands-free stage scrolling.

Check out the live workstation at [openlyryc.pages.dev](https://openlyryc.pages.dev) or explore the code on GitHub.

  <script>
    // Copyright Year
    document.getElementById('yr').textContent = new Date().getFullYear();

    // Articles Catalog Definition
    const POSTS = [
      {
        id: 'hogamegata',
        num: '01',
        title: 'Building hoGAMEGATA: Preserving 100,000+ Horror Games',
        date: 'October 24, 2026',
        readTime: '6 min read',
        summary:'',
        file: 'posts/hogamegata.md',
        tags: ['Astro', 'Cloudflare Workers', 'Turso', 'Preservation'],
        cover: 'hogamegata.png'
      },
      {
        id: 'openlyryc',
        num: '02',
        title: 'OpenLyryc: Crafting a Browser-Native Synced Lyrics Workstation',
        date: 'November 01, 2026',
        readTime: '5 min read',
        summary: 'Why desktop subtitle tools fell short and how we built word-by-word karaoke sync, live stage prompter visualizer, and TTML export in the browser.',
        file: 'posts/openlyryc.md',
        tags: ['Web Audio API', 'TypeScript', 'Lyrics', 'Music Tool', 'Synchronization'],
        cover: 'openlyryc.png'
      }
    ];

    // Curvy Scroll Progress Logic
    const progressPath = document.getElementById('scrollProgressPath');
    let pathLength = 0;

    const initPath = () => {
      if (progressPath) {
        pathLength = progressPath.getTotalLength();
        progressPath.style.strokeDasharray = pathLength;
        progressPath.style.strokeDashoffset = pathLength;
      }
    };

    const updateScrollProgress = () => {
      const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
      const currentScroll = window.scrollY;
      const rawPercent = totalScroll > 0 ? (currentScroll / totalScroll) * 100 : 0;
      const scrollPercent = Math.min(100, Math.max(0, rawPercent));
      if (progressPath && pathLength > 0) {
        const drawLength = pathLength * (scrollPercent / 100);
        progressPath.style.strokeDashoffset = pathLength - drawLength;
      }
    };

    initPath();
    updateScrollProgress();
    window.addEventListener('scroll', updateScrollProgress, { passive: true });
    window.addEventListener('resize', () => {
      initPath();
      updateScrollProgress();
    }, { passive: true });

    // Render Hub Article Cards
    const renderHub = () => {
      const grid = document.getElementById('articlesGrid');
      grid.innerHTML = POSTS.map(post => `
        <div class="article-card" onclick="openArticle('${post.id}')" data-id="${post.id}">
          <span class="article-num">${post.num}</span>
          <div class="article-info">
            <div class="article-card-meta">${post.date}</div>
            <h2 class="article-card-title">${post.title}</h2>
            <div class="article-read-cta">Read here</div>
          </div>
          <div class="article-media">
            <img src="${post.cover}" alt="${post.title}" loading="lazy">
          </div>
        </div>
      `).join('');
    };

    // Load and Render Single Article
    const openArticle = async (id, updateHistory = true) => {
      const post = POSTS.find(p => p.id === id);
      if (!post) {
        showHub();
        return;
      }

      const hubView = document.getElementById('hubView');
      const articleView = document.getElementById('articleView');
      const articleTitle = document.getElementById('articleTitle');
      const articleMeta = document.getElementById('articleMeta');
      const articleTags = document.getElementById('articleTags');
      const articleBody = document.getElementById('articleBody');

      // Update browser tab title
      document.title = `${post.title} | aurostron`;

      // Switch view immediately so page is never stuck even if some DOM nodes are modified
      if (hubView) hubView.style.display = 'none';
      if (articleView) articleView.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'instant' });

      // Safely populate Header fields if elements exist
      if (articleTitle) articleTitle.textContent = post.title;
      if (articleMeta) {
        articleMeta.textContent = post.date || '';
      }
      if (articleTags) {
        if (post.tags && post.tags.length > 0) {
          articleTags.innerHTML = post.tags.map(t => `<span class="article-header-tag">${t}</span>`).join('');
          articleTags.style.display = 'flex';
        } else {
          articleTags.innerHTML = '';
          articleTags.style.display = 'none';
        }
      }
      if (articleBody) articleBody.innerHTML = '<p style="color: var(--muted);">Loading essay...</p>';

      if (updateHistory) {
        history.pushState({ post: id }, '', `?post=${id}`);
      }

      // Prev / Next Navigation without icons or arrows
      const currentIndex = POSTS.findIndex(p => p.id === id);
      const prevLink = document.getElementById('prevPostLink');
      const nextLink = document.getElementById('nextPostLink');

      if (prevLink) {
        if (currentIndex > 0) {
          const prevPost = POSTS[currentIndex - 1];
          prevLink.style.display = 'inline-flex';
          prevLink.textContent = `Previous`;
          prevLink.title = prevPost.title;
          prevLink.onclick = (e) => { e.preventDefault(); openArticle(prevPost.id); };
        } else {
          prevLink.style.display = 'none';
        }
      }

      if (nextLink) {
        if (currentIndex < POSTS.length - 1) {
          const nextPost = POSTS[currentIndex + 1];
          nextLink.style.display = 'inline-flex';
          nextLink.textContent = `Next`;
          nextLink.title = nextPost.title;
          nextLink.onclick = (e) => { e.preventDefault(); openArticle(nextPost.id); };
        } else {
          nextLink.style.display = 'none';
        }
      }

      // Fetch markdown from external file, falling back to embedded markdown
      let markdownText = '';
      try {
        const res = await fetch(post.file);
        if (res.ok) {
          markdownText = await res.text();
        } else {
          throw new Error('HTTP ' + res.status);
        }
      } catch (err) {
        const fallbackScript = document.getElementById(`fallback-${id}`);
        if (fallbackScript) {
          markdownText = fallbackScript.textContent;
        } else {
          markdownText = `# ${post.title}\n\n*Unable to load file: ${post.file}*`;
        }
      }

      // Strip duplicated top heading/meta in markdown since header already renders it
      let cleanMarkdown = markdownText
        .trim()
        .replace(/^#\s+[^\n]+\n*/, '')
        .replace(/^\*[^\n]+\*\n*/, '')
        .replace(/^---\n*/, '');

      // Parse with marked
      if (articleBody) {
        if (window.marked && typeof window.marked.parse === 'function') {
          articleBody.innerHTML = window.marked.parse(cleanMarkdown);
        } else {
          articleBody.innerHTML = `<pre>${cleanMarkdown}</pre>`;
        }
      }

      setTimeout(() => {
        initPath();
        updateScrollProgress();
      }, 50);
    };

    // Return to Hub
    const showHub = (updateHistory = true) => {
      const hubView = document.getElementById('hubView');
      const articleView = document.getElementById('articleView');
      if (hubView) hubView.style.display = 'block';
      if (articleView) articleView.classList.remove('active');
      document.title = 'Writing & Essays | aurostron';

      if (updateHistory) {
        history.pushState(null, '', 'blog.html');
      }

      setTimeout(() => {
        initPath();
        updateScrollProgress();
      }, 50);
    };

    const backBtn = document.getElementById('backToHubBtn');
    if (backBtn) {
      backBtn.addEventListener('click', () => showHub());
    }

    // Handle Browser Back / Forward buttons
    window.addEventListener('popstate', (e) => {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('post');
      if (postId) {
        openArticle(postId, false);
      } else {
        showHub(false);
      }
    });

    // Initial Routing based on URL parameter ?post=xxx
    renderHub();
    const initialParams = new URLSearchParams(window.location.search);
    const initialPost = initialParams.get('post');
    if (initialPost) {
      openArticle(initialPost, false);
    }
  </script>
